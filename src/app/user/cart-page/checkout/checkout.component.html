<div class="flex flex-col justify-center items-center max-w-[600px] mx-auto mb-32">
  <div class="flex flex-row justify-start w-full mt-20 mb-8">
    <h2 class="text-3xl">Place Order</h2>
  </div>

  <form [formGroup]="checkoutForm" class="w-full flex flex-col gap-4">

    <!-- User Details -->
    <div class="bg-white flex flex-col gap-2 rounded-md pb-8 pt-4 px-8 border border-black shadow-2xs">
      <h2 class="text-xl">User Information</h2>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" formControlName="name" class="form-control">
      </div>
      <div>
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" formControlName="phoneNumber" class="form-control">
      </div>
      <div>
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" class="form-control">
      </div>
    </div>

    <!-- Address -->
    <div class="bg-white flex flex-col gap-2 rounded-md pb-8 pt-4 px-8 border border-black shadow-2xs">
      <h2 class="text-xl">Address Information</h2>
      <div>
        <label for="houseNumber">House Number</label>
        <input type="text" id="houseNumber" formControlName="houseNumber" class="form-control">
      </div>
      <div>
        <label for="area">Area / Street</label>
        <input type="text" id="area" formControlName="area" class="form-control">
      </div>
      <div>
        <label for="landmark">Landmark (Optional)</label>
        <input type="text" id="landmark" formControlName="landmark" class="form-control">
      </div>
      <div>
        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" formControlName="pincode" class="form-control">
      </div>
      <div>
        <label for="city">City</label>
        <input type="text" id="city" formControlName="city" class="form-control">
      </div>
      <div>
        <label for="state">State</label>
        <input type="text" id="state" formControlName="state" class="form-control">
      </div>
    </div>

    <!-- Order Summary -->
    <div class="bg-white flex flex-col gap-2 rounded-md pb-8 pt-4 px-8 border border-black shadow-2xs">
      <h2 class="text-xl">Order Summary</h2>
      <div class="flex justify-between">
        <span>Subtotal</span>
        <span>₹{{ subTotal }}</span>
      </div>
      <div class="flex justify-between">
        <span>Delivery Charge</span>
        <span>{{ deliveryCharge === 0 ? 'FREE' : '₹' + deliveryCharge }}</span>
      </div>
      <div class="flex justify-between" *ngIf="couponAmount > 0">
        <span>Coupon ({{ couponCode }})</span>
        <span>- ₹{{ couponAmount }}</span>
      </div>
      <hr>
      <div class="flex justify-between font-bold text-lg">
        <span>Grand Total</span>
        <span>₹{{ grandTotal }}</span>
      </div>
    </div>

    <!-- Pay Button -->
    <button type="button"
      class="bg-black text-white w-full px-14 py-3 border border-black rounded-md
             hover:bg-white hover:text-black transition cursor-pointer"
      (click)="onPayNow()">
      PAY ₹{{ grandTotal }}
    </button>

  </form>
</div>
